name: "Towonel Agent"
version: "1.7.1"
slug: "towonel_agent"
description: "Towonel tunnel agent for Home Assistant – exposes HA through a self-hosted Towonel hub"
url: "https://towonel.dev"
arch:
  - amd64
  - aarch64
startup: services
boot: auto
host_network: true
apparmor: false
options:
  TOWONEL_INVITE_TOKEN: ""
  TOWONEL_AGENT_SERVICES: '[{"hostname":"ha.example.com","origin":"127.0.0.1:8123"}]'
  TOWONEL_AGENT_TCP_SERVICES: "[]"
  TOWONEL_AGENT_UDP_SERVICES: "[]"
  TOWONEL_AGENT_TRUSTED_EDGES: ""
  RUST_LOG: "info"
  custom_env_vars: []
schema:
  TOWONEL_INVITE_TOKEN: "str"
  TOWONEL_AGENT_SERVICES: "str"
  TOWONEL_AGENT_TCP_SERVICES: "str"
  TOWONEL_AGENT_UDP_SERVICES: "str"
  TOWONEL_AGENT_TRUSTED_EDGES: "str?"
  RUST_LOG: "list(trace|debug|info|warn|error)?"
  custom_env_vars:
    - "match(^[A-Z_][A-Z0-9_]*=.+$)"
hassio_api: false
homeassistant_api: false
auth_api: false
hassio_role: "default"
